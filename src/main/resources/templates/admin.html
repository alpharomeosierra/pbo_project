<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RS XXXXX | Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      padding-top: 60px;
    }
    .sidebar {
      height: 100vh;
      position: fixed;
      top: 56px;
      left: 0;
      width: 220px;
      background-color: #f8f9fa;
      padding-top: 20px;
      border-right: 1px solid #dee2e6;
    }
    .content {
      margin-left: 240px;
    }
    .dashboard-card {
      transition: transform 0.2s;
    }
    .dashboard-card:hover {
      transform: scale(1.03);
    }

    .nomor-antrian {
      margin-left: 250px; /* same as sidebar width */
      padding: 2rem;
    }
  </style>
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">RS XXXXX</a>
    </div>
  </nav>

  <!-- Sidebar -->
  <div class="sidebar">
    <ul class="nav flex-column">
      <li class="nav-item">
        <a class="nav-link active" href="#">Dashboard</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="#">Data Registrasi Pasien</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="#">Jadwal Praktik</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="#">Data Karyawan</a>
      </li>
      <li class="nav-item">
        <form th:action="@{/logout}" method="post" class="nav-link px-0">
          <button type="submit" class="btn btn-link p-0" style="text-decoration: none; color: inherit;">Keluar</button>
        </form>
      </li>
    </ul>
  </div>

  <!-- Main Content Area -->
<div class="nomor-antrian">
  <div class="container">
    <!-- Giant Box for Queue Number -->
    <div class="row justify-content-center mb-4">
      <div class="col-12 col-md-10">
        <div class="card text-center p-5 bg-light">
          <h1 class="display-3 fw-bold">A012</h1>
          <p class="lead">Nomor Antrian</p>
        </div>
      </div>
    </div>

    <!-- Two Smaller Boxes Below -->
    <div class="row justify-content-center g-4">
      <div class="col-md-5">
        <div class="card text-center p-4">
          <h5 class="card-title">Antrian Selanjutnya</h5>
          <p class="card-text fs-4">A013</p>
        </div>
      </div>
      <div class="col-md-5">
        <div class="card text-center p-4">
          <h5 class="card-title">Sisa Pasien Hari Ini</h5>
          <p class="card-text fs-4">15 Pasien</p>
        </div>
      </div>
    </div>
  </div>

  <div class="row justify-content-center g-4 mt-4">
    <div class="col-md-5">
      <div class="card text-center p-4 shadow-sm">
        <h5 class="card-title">Registrasi Pasien</h5>
        <p class="card-text">Tambah dan kelola data pasien.</p>
        <a href="#" class="btn btn-primary mt-2">Buka Menu</a>
      </div>
    </div>
    <div class="col-md-5">
      <div class="card text-center p-4 shadow-sm">
        <h5 class="card-title">Jadwal Praktik</h5>
        <p class="card-text">Lihat dan atur jadwal praktik dokter.</p>
        <a href="#" class="btn btn-primary mt-2">Buka Menu</a>
      </div>
    </div>
  </div>

</div>


 

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
