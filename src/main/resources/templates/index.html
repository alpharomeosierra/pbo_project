<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Plant Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Plant Management</h1>
            <form th:action="@{/logout}" method="post" style="margin:0;">
                <button type="submit" class="btn btn-outline-danger">Logout</button>
            </form>
        </div>
        
        <a th:href="@{/add}" class="btn btn-primary mb-3">Add New Plant</a>
        
        <table class="table table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>Name</th>
                    <th>Species</th>
                    <th>Description</th>
                    <th>Care Instructions</th>
                    <th>Watering Frequency (days)</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="plant : ${plants}">
                    <td th:text="${plant.name}"></td>
                    <td th:text="${plant.species}"></td>
                    <td th:text="${plant.description}"></td>
                    <td th:text="${plant.careInstructions}"></td>
                    <td th:text="${plant.wateringFrequency}"></td>
                    <td>
                        <a th:href="@{/edit/{id}(id=${plant.id})}" class="btn btn-warning btn-sm">Edit</a>
                        <a th:href="@{/delete/{id}(id=${plant.id})}" class="btn btn-danger btn-sm"
                           onclick="return confirm('Are you sure you want to delete this plant?')">Delete</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
