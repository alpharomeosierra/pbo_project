<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Plant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">Edit Plant</h1>
        
        <form th:action="@{/edit/{id}(id=${plant.id})}" th:object="${plant}" method="post">
            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" class="form-control" id="name" th:field="*{name}" required>
            </div>
            
            <div class="mb-3">
                <label for="species" class="form-label">Species</label>
                <input type="text" class="form-control" id="species" th:field="*{species}" required>
            </div>
            
            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control" id="description" th:field="*{description}" rows="3"></textarea>
            </div>
            
            <div class="mb-3">
                <label for="careInstructions" class="form-label">Care Instructions</label>
                <textarea class="form-control" id="careInstructions" th:field="*{careInstructions}" rows="3"></textarea>
            </div>
            
            <div class="mb-3">
                <label for="wateringFrequency" class="form-label">Watering Frequency (days)</label>
                <input type="number" class="form-control" id="wateringFrequency" th:field="*{wateringFrequency}" required>
            </div>
            
            <button type="submit" class="btn btn-primary">Update Plant</button>
            <a href="/" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
